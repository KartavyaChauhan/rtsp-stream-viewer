services:
  backend:
    build: .
    env_file: .env
    volumes: ["./backend/media:/app/backend/media"]
    ports: ["8000:8000"]
    depends_on: [redis]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment: ["VITE_API_URL=http://localhost:8000", "VITE_WS_URL=ws://localhost:8000"]
  redis:
    image: redis:7-alpine
